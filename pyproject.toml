[project]
name = "skills-building"
version = "0.1.0"
description = "Claude Code skills for JnJ-branded document generation (decks, markdown, HTML) with web research"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hatchling>=1.28.0",
    "openai>=2.21.0",
    "python-dotenv>=1.2.1",
    "python-pptx>=1.0.2",
    "tavily-python>=0.7.21",
]

[project.scripts]
skills-research = "skills_building.research:_cli"
skills-markdown = "skills_building.markdown:_cli"
skills-deck = "skills_building.deck:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills_building"]
